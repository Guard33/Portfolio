<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#e7d8b3"/>
      <circle cx="1" cy="1" r="1" fill="#c7ae7a"/>
    </pattern>
  </defs>

  <rect width="800" height="400" fill="url(#grain)"/>

  <!-- panel hard shadow -->
  <rect x="216" y="46" width="380" height="320" fill="#2b1d0e"/>
  <!-- panel -->
  <rect x="210" y="40" width="380" height="320" fill="#e7d8b3" stroke="#2b1d0e" stroke-width="4"/>

  <!-- quill badge -->
  <rect x="368" y="70" width="64" height="64" fill="#d8c495" stroke="#2b1d0e" stroke-width="3"/>
  <g fill="#2b1d0e" transform="translate(384,86) scale(4)">
    <rect x="6" y="0" width="1" height="1"/>
    <rect x="5" y="1" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/>
    <rect x="3" y="2" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/><rect x="5" y="2" width="1" height="1"/>
    <rect x="2" y="3" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="4" y="3" width="1" height="1"/>
    <rect x="1" y="4" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="3" y="4" width="1" height="1"/>
    <rect x="0" y="5" width="1" height="1"/><rect x="1" y="5" width="1" height="1"/><rect x="2" y="5" width="1" height="1"/>
    <rect x="0" y="6" width="1" height="1"/><rect x="1" y="6" width="1" height="1"/>
    <rect x="1" y="7" width="1" height="1"/>
  </g>

  <text x="400" y="190" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="34" letter-spacing="4" fill="#2b1d0e">NOTEPAD</text>

  <text x="400" y="222" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#6b5535">jot it down &#183; tag it &#183; find it later</text>

  <!-- buttons -->
  <rect x="290" y="260" width="120" height="40" fill="#7a1f1f" stroke="#2b1d0e" stroke-width="3"/>
  <rect x="294" y="264" width="120" height="40" fill="none" stroke="#2b1d0e" stroke-width="0"/>
  <text x="350" y="285" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="12" letter-spacing="1" fill="#e7d8b3">GET STARTED</text>

  <rect x="420" y="260" width="90" height="40" fill="#e7d8b3" stroke="#2b1d0e" stroke-width="3"/>
  <text x="465" y="285" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="12" letter-spacing="1" fill="#2b1d0e">LOG IN</text>

  <text x="400" y="335" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="2" fill="#6b5535">FREE FOREVER</text>
</svg>
